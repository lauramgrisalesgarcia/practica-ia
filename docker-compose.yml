services:
  db:
    image: postgres:16
    container_name: practica_ia_db
    environment:
      POSTGRES_USER: practica
      POSTGRES_PASSWORD: practica
      POSTGRES_DB: practica_ia
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practica -d practica_ia"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
